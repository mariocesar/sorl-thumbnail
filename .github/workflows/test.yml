name: Test

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.2
      with:
        python-version: '3.10'
        cache-dependency-glob: |
          pyproject.toml
          tox.ini

    - name: Tox qa
      run: |
        uvx --with tox-uv tox -v -e py310-qa

  build:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        python-version: ['3.10', '3.14']
        target: [pil, imagemagick, graphicsmagick, redis, wand, dbm, vips]
    steps:
    - uses: actions/checkout@v7

    - name: Start Redis
      if: matrix.target == 'redis'
      uses: supercharge/redis-github-action@1.8.1

    - name: Install ImageMagick
      if: matrix.target == 'imagemagick' || matrix.target == 'wand'
      run: |
        sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
        sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Dpkg::Options::=--force-unsafe-io install --no-install-recommends imagemagick libheif-plugin-aomenc

    - name: Install GraphicsMagick
      if: matrix.target == 'graphicsmagick'
      run: |
        sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
        sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Dpkg::Options::=--force-unsafe-io install --no-install-recommends graphicsmagick

    - name: Set up uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v10.3.2
      with:
        python-version: ${{ matrix.python-version }}
        cache-dependency-glob: |
          pyproject.toml
          tox.ini

    - name: Tox tests
      run: |
        uvx --with tox-uv --with tox-gh-actions tox -v
      env:
        TARGET: ${{ matrix.target }}

    - name: Upload coverage
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        name: Python ${{ matrix.python-version }}
