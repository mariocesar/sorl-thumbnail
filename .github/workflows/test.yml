name: Test

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.0
      with:
        python-version: '3.10'
        cache-dependency-glob: |
          pyproject.toml
          tox.ini

    - name: Tox qa
      run: |
        uvx --with tox-uv tox -v -e py310-qa

  build:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        python-version: ['3.10', '3.14']
        target: [pil, imagemagick, graphicsmagick, redis, wand, dbm]
    steps:
    - uses: actions/checkout@v7

    - name: Start Redis
      if: matrix.target == 'redis'
      uses: supercharge/redis-github-action@1.8.1

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install imagemagick libjpeg62 zlib1g-dev libavif-dev libheif-plugin-aomenc

    - name: Install GraphicsMagick
      if: matrix.target == 'graphicsmagick'
      run: |
        sudo apt-get install libgraphicsmagick1-dev graphicsmagick

    - name: Set up uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v10.3.0
      with:
        python-version: ${{ matrix.python-version }}
        cache-dependency-glob: |
          pyproject.toml
          tox.ini

    - name: Tox tests
      run: |
        uvx --with tox-uv --with tox-gh-actions tox -v
      env:
        TARGET: ${{ matrix.target }}

    - name: Upload coverage
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        name: Python ${{ matrix.python-version }}
