{% load thumbnail %}
{% thumbnail "images/caritas-romana.webp" "200x200" as im %}
  <div style="display: inline-block; background: #e6e1d6">
    <img src="{{ im.url }}" loading="lazy"
         width="{{ im.width }}" height="{{ im.height }}"
         style="display: block; margin: {{ im|margin:"200x200" }}"
         alt="Caritas Romana centered in a 200 by 200 frame">
  </div>
{% endthumbnail %}
