[build-system]
requires = ["setuptools>=77","setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "sorl-thumbnail"
dynamic = ["version"]
description = "Thumbnails for Django"
readme = "README.rst"
license = "BSD-3-Clause"
keywords = ["django", "thumbnail", "sorl"]
authors = [
  {name = "Mikko Hellsing", email = "mikko@aino.se"},
]
maintainers = [
  {name = "Mario-César"}
]
requires-python = ">= 3.10"
classifiers=[
    'Development Status :: 5 - Production/Stable',
    'Environment :: Web Environment',
    'Intended Audience :: Developers',
    'Operating System :: OS Independent',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Topic :: Internet :: WWW/HTTP :: Dynamic Content',
    'Topic :: Multimedia :: Graphics',
    'Framework :: Django',
    'Framework :: Django :: 5.2',
    'Framework :: Django :: 6.0',
    'Framework :: Django :: 6.1',
]

[project.urls]
Homepage = "https://sorl-thumbnail.readthedocs.io/en/latest/"
Repository = "https://github.com/mariocesar/sorl-thumbnail"

[project.optional-dependencies]
pgmagick = ["pgmagick"]
pil = ["pillow"]
wand = ["wand"]
avif = ["pillow-avif-plugin"]
docs = ["sphinx"]

[dependency-groups]
# The examples site in demo/: uv run --group demo demo/manage.py runserver
demo = ["django>=5.2", "pillow", "wand"]

[tool.coverage.run]
 source = ["sorl"]
 omit = [
     "*/sorl-thumbnail/sorl/__init__.py",
     "*/sorl/thumbnail/__init__.py",
     "*/sorl/thumbnail/conf/__init__.py",
     "*/sorl/thumbnail/admin/__init__.py",
 ]

 [tool.coverage.report]
 exclude_lines = [
     "pragma: no cover",
     "if __name__ == .__main__.:",
 ]
 
# below line is required to generating versions with setuptools_scm
[tool.setuptools_scm]

[tool.setuptools.packages.find]
include = ["sorl", "sorl.*"]

[tool.ruff]
exclude = [
    ".tox",
    "docs/*",
    "*/migrations/*",
    "tests/settings/*",
    "sorl/thumbnail/__init__.py",
    "sorl/thumbnail/admin/__init__.py"
]
line-length = 100

[tool.ruff.lint]
select = ["B", "C901", "E", "F", "I", "W"]
ignore = ["B904", "B017"]

[tool.ruff.lint.per-file-ignores]
"demo/settings/*" = ["F403", "F405"]

[tool.ruff.lint.mccabe]
max-complexity = 15
