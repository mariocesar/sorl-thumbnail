[gh-actions]
python =
  3.10: py310
  3.11: py311
  3.12: py312
  3.13: py313
  3.14: py314

[gh-actions:env]
DJANGO =
  5.2: django52
  6.0: django60
  6.1: django61
TARGET =
  pil: pil
  imagemagick: imagemagick
  graphicsmagick: graphicsmagick
  redis: redis
  wand: wand
  dbm: dbm
  vips: vips
  qa: qa

[tox]
requires = tox-uv
min_version = 4
no_package = true
envlist =
  py310-qa,
  py{310,311,312,313}-django52-{pil,imagemagick,graphicsmagick,redis,wand,pgmagick,dbm,vips}
  py{312,313,314}-django{60,61}-{pil,imagemagick,graphicsmagick,redis,wand,pgmagick,dbm,vips}

[testenv]
deps =
  coverage[toml]
  pillow
  pillow-avif-plugin
  redis: redis
  pgmagick: pgmagick
  wand: wand
  vips: pyvips[binary]
  django52: django>=5.2,<5.3
  django60: django>=6.0,<6.1
  django61: django>=6.1,<6.2

passenv = REDIS_HOST
setenv =
  PYTHONPATH = {toxinidir}:{toxinidir}
  pil: DJANGO_SETTINGS_MODULE=tests.settings.pil
  imagemagick: DJANGO_SETTINGS_MODULE=tests.settings.imagemagick
  graphicsmagick: DJANGO_SETTINGS_MODULE=tests.settings.graphicsmagick
  vips: DJANGO_SETTINGS_MODULE=tests.settings.vips
  redis: DJANGO_SETTINGS_MODULE=tests.settings.redis
  wand: DJANGO_SETTINGS_MODULE=tests.settings.wand
  pgmagick: DJANGO_SETTINGS_MODULE=tests.settings.pgmagick
  dbm: DJANGO_SETTINGS_MODULE=tests.settings.dbm
commands =
  coverage run {envbindir}/django-admin test -v2 {posargs:}
  coverage report -m
  coverage xml

[testenv:py310-qa]
skip_install = True
deps =
  ruff
  rstcheck
  sphinx
commands =
  ruff check sorl/ demo/
  python -m rstcheck README.rst CHANGES.rst CONTRIBUTING.rst
  sphinx-build -W -n -q -b html docs {envtmpdir}/docs
